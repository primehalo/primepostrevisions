name: Tests

on:
    push:               # Run checks when commits are pushed to these branches
        branches:
            - master
    pull_request:       # Run checks on pull requests to these branches
        branches:
            - master

jobs:
    call-tests:
        name: Extension tests
        uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@3.3.x
        with:
            EXTNAME: primehalo/primepostrevisions   # Your extension vendor/package name
            SNIFF: 1                                # Run code sniffer on your code?
            IMAGE_ICC: 1                            # Run icc profile sniffer on your images?
            EPV: 1                                  # Run EPV (Extension Pre Validator) on your code?
            EXECUTABLE_FILES: 1                     # Run check for executable files?

            # This extension has no PHPUnit tests yet, so only the basic checks above are run.
            # Set these to 1 after adding a tests/ directory.
            RUN_MYSQL_JOBS: 0
            RUN_PGSQL_JOBS: 0
            RUN_MSSQL_JOBS: 0
            RUN_WINDOWS_JOBS: 0
